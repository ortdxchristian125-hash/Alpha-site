<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧОО «АЛЬФА» — Терминал v5.1</title>
    <style>
        :root {
            --bg: #0A0C0F;
            --pn: #12161C;
            --bd: #1E2A36;
            --ac: #7F0000;
            --rd: #E63946;
            --gn: #2ECC71;
            --or: #F39C12;
            --tx: #C8CDD2;
            --mt: #7A8490;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s;
        }

        body.alarm {
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { background: #0A0000; }
            50% { background: #1A0000; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes ap {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 0, .5); }
            50% { box-shadow: 0 0 50px rgba(255, 0, 0, .9); }
        }

        .card {
            background: var(--pn);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .logo {
            text-align: center;
            color: var(--ac);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo-img {
            display: block;
            margin: 0 auto 15px;
            max-width: 120px;
            max-height: 80px;
            object-fit: contain;
        }

        .sub {
            text-align: center;
            color: var(--mt);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            font: inherit;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
            text-align: center;
            text-decoration: none;
            letter-spacing: 1px;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-start { background: var(--gn); color: #fff; }
        .btn-end { background: var(--rd); color: #fff; }
        .btn-alarm {
            background: #8B0000;
            color: #fff;
            font-size: 20px;
            padding: 20px;
            border: 2px solid #F44;
        }
        .btn-alarm.active {
            animation: ap 0.5s infinite;
            background: red;
        }
        .btn-act {
            background: #1E2A36;
            color: var(--tx);
            font-size: 14px;
            padding: 12px;
        }
        .btn-sm {
            padding: 8px 18px;
            font-size: 12px;
            width: auto;
            display: inline-block;
        }
        .btn-xs {
            padding: 5px 12px;
            font-size: 10px;
            width: auto;
            display: inline-block;
        }

        .info-t {
            font-size: 11px;
            color: var(--mt);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        th {
            text-align: left;
            color: var(--mt);
            padding: 10px 8px;
            border-bottom: 2px solid var(--bd);
            font-size: 11px;
            text-transform: uppercase;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(30, 42, 54, .5);
        }
        tr:hover td {
            background: rgba(255, 255, 255, .02);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-on { background: #1a3a2a; color: var(--gn); }
        .badge-off { background: #3a1a1a; color: var(--rd); }
        .badge-adm { background: #1a2a3a; color: var(--ac); border: 1px solid var(--ac); }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            background: #0D1117;
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--ac);
        }
        textarea {
            resize: none;
            height: 80px;
        }

        .scroll { max-height: 400px; overflow-y: auto; }
        .flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .flex-c { flex: 1; min-width: 350px; }
        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .out {
            color: var(--rd);
            text-decoration: none;
            font-size: 12px;
            padding: 8px 16px;
            border: 1px solid var(--rd);
            border-radius: 8px;
            cursor: pointer;
        }
        .out:hover { background: var(--rd); color: #fff; }

        a { color: var(--ac); text-decoration: none; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-in {
            background: var(--pn);
            border: 1px solid var(--ac);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            animation: mi .3s;
        }
        @keyframes mi {
            from { transform: scale(.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .det-l {
            color: var(--mt);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .det-v {
            font-size: 16px;
            margin-bottom: 16px;
            color: #E8EDF2;
        }
        .det-t {
            background: #0D1117;
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active { display: block; }

        .form-expand {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            margin-top: 0;
        }
        .form-expand.open { margin-top: 15px; }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--bd);
            border-top-color: var(--ac);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--mt);
            font-size: 14px;
            letter-spacing: 2px;
        }
        .loading-error {
            background: #3a1a1a;
            color: var(--rd);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--rd);
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <!-- ======== ЗАГРУЗКА ======== -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">ЗАГРУЗКА ТЕРМИНАЛА...</div>
    </div>

    <!-- ======== LOGIN PAGE ======== -->
    <div id="login-page" class="page">
        <div style="display:flex;justify-content:center;align-items:center;min-height:90vh">
            <div class="card" style="width:400px;text-align:center;padding:40px">
                <img src="static/logo.png" class="logo-img" onerror="this.style.display='none'" alt="Логотип">
                <div class="logo">ЧОО «АЛЬФА»</div>
                <div class="sub">ТЕРМИНАЛ v5.1</div>
                <div style="font-size:48px;margin:20px 0">🛡️</div>
                <div id="login-error" style="background:#3a1a1a;color:var(--rd);padding:12px;border-radius:8px;margin-bottom:20px;border:1px solid var(--rd);display:none"></div>
                <form id="login-form">
                    <input name="u" id="login-username" placeholder="Логин" required autofocus>
                    <input name="p" id="login-password" type="password" placeholder="Пароль" required>
                    <button type="submit" class="btn btn-start">🔐 ВОЙТИ</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ======== TERMINAL PAGE ======== -->
    <div id="terminal-page" class="page">
        <div style="max-width:650px;margin:0 auto" id="terminal-content"></div>
    </div>

    <!-- ======== REPORTS PAGE ======== -->
    <div id="reports-page" class="page">
        <div style="max-width:650px;margin:0 auto" id="reports-content"></div>
    </div>

    <!-- ======== REPORT DETAIL MODAL ======== -->
    <div id="report-modal" class="modal" style="display:none">
        <div class="modal-in" id="report-modal-content"></div>
    </div>

    <!-- ======== ADMIN PAGE ======== -->
    <div id="admin-page" class="page">
        <div style="max-width:1200px;margin:0 auto" id="admin-content"></div>
    </div>

    <script>
        // ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
        let USERS = {};
        let USERS_LOWER = {};

        // Состояние
        let state = {
            currentUser: null,
            shiftCounter: 100,
            reports: [],
            alarms: [],
            shiftHistory: [],
            activeShifts: {},
            alarmActive: false
        };

        // ===== ФУНКЦИИ ФОРМАТИРОВАНИЯ =====
        function formatTimer(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatDate(d) {
            if (!d) return '--';
            const date = new Date(d);
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function formatDateTime(date) {
            const d = new Date(date);
            const dateStr = d.toLocaleDateString('ru-RU');
            const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            return `${dateStr} ${timeStr}`;
        }

        function getReportColor(type) {
            const cm = {
                'Задержание': '#E74C3C',
                'Докладная': '#F39C12',
                'Обход территории': '#1ABC9C',
                'Применение оружия': '#E67E22',
                'ГБР Выезд': '#3498DB',
                'ТРЕВОГА': '#FF0000',
                'О смене': '#00B4D8'
            };
            return cm[type] || '#C8CDD2';
        }

        // ===== ЗАГРУЗКА ДАННЫХ =====
        async function loadUsers() {
            console.log('='.repeat(60));
            console.log('🔍 ДИАГНОСТИКА users.json');
            console.log('='.repeat(60));
            
            try {
                const response = await fetch('users.json', { cache: 'no-cache' });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const text = await response.text();
                console.log('📄 Содержимое файла:');
                console.log(text.substring(0, 200) + (text.length > 200 ? '...' : ''));
                
                const users = JSON.parse(text);
                USERS = users;
                
                // Создаём lowercase-маппинг
                USERS_LOWER = {};
                for (let k in USERS) {
                    USERS_LOWER[k.toLowerCase()] = k;
                }
                
                console.log(`\n✅ Загружено пользователей: ${Object.keys(USERS).length}`);
                for (let login in USERS) {
                    const data = USERS[login];
                    console.log(`   • '${login}' — ${data.full_name} (пароль: ${data.password.substring(0, 3)}***)`);
                }
                
                return true;
            } catch (error) {
                console.error('❌ Ошибка загрузки users.json:', error);
                
                // Запасной вариант
                USERS = {
                    "admin": {"password": "admin123", "full_name": "Администратор", "role": "admin"}
                };
                USERS_LOWER = {"admin": "admin"};
                
                return false;
            }
        }

        async function loadData() {
            console.log('\n' + '='.repeat(60));
            console.log('🔍 ЗАГРУЗКА alpha_data.json');
            console.log('='.repeat(60));
            
            try {
                const response = await fetch('alpha_data.json', { cache: 'no-cache' });
                
                if (!response.ok) {
                    console.log('📝 Файл не найден, создаём новый');
                    return;
                }
                
                const text = await response.text();
                if (!text.trim()) {
                    console.log('📝 Файл пуст, создаём новый');
                    return;
                }
                
                const data = JSON.parse(text);
                console.log('✅ Данные загружены');
                
                state.shiftCounter = data.shift_counter || 100;
                state.reports = data.reports || [];
                state.alarms = data.alarms || [];
                state.shiftHistory = data.shift_history || [];
                
                // Восстанавливаем активные смены
                if (data.active_shifts) {
                    for (let username in data.active_shifts) {
                        const s = data.active_shifts[username];
                        state.activeShifts[username] = {
                            shift_id: s.shift_id,
                            start_time: s.start_time ? new Date(s.start_time) : new Date(),
                            elapsed_seconds: s.elapsed_seconds || 0
                        };
                    }
                }
                
                console.log(`   • Смен: ${state.shiftCounter}`);
                console.log(`   • Отчётов: ${state.reports.length}`);
                console.log(`   • Тревог: ${state.alarms.length}`);
                console.log(`   • Активных смен: ${Object.keys(state.activeShifts).length}`);
                
            } catch (error) {
                console.error('❌ Ошибка загрузки alpha_data.json:', error);
            }
        }

        function saveData() {
            const toSave = {
                shift_counter: state.shiftCounter,
                reports: state.reports,
                alarms: state.alarms,
                shift_history: state.shiftHistory,
                active_shifts: {}
            };
            
            for (let username in state.activeShifts) {
                const s = state.activeShifts[username];
                toSave.active_shifts[username] = {
                    shift_id: s.shift_id,
                    start_time: s.start_time ? s.start_time.toISOString() : '',
                    elapsed_seconds: s.elapsed_seconds
                };
            }
            
            // Сохраняем в localStorage для работы без сервера
            localStorage.setItem('alpha_data', JSON.stringify(toSave));
            console.log('💾 Данные сохранены в localStorage');
        }

        // ===== НАВИГАЦИЯ =====
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const page = document.getElementById(pageId);
            if (page) page.classList.add('active');
            updateCurrentPage();
        }

        function updateCurrentPage() {
            if (!state.currentUser) return;
            const activePage = document.querySelector('.page.active');
            if (!activePage) return;
            const pageId = activePage.id;

            if (pageId === 'terminal-page') renderTerminal();
            else if (pageId === 'reports-page') renderReports();
            else if (pageId === 'admin-page') renderAdmin();
        }

        // ===== ТАЙМЕР =====
        let lastTick = Date.now();
        setInterval(() => {
            const now = Date.now();
            const elapsed = (now - lastTick) / 1000;
            lastTick = now;
            
            for (let s of Object.values(state.activeShifts)) {
                s.elapsed_seconds += elapsed;
            }
            
            // Автосохранение каждые 5 секунд
            if (Math.floor(now / 5000) !== Math.floor((now - 100) / 5000)) {
                saveData();
            }
            
            updateCurrentPage();
        }, 100);

        // ===== ЛОГИН =====
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const rawLogin = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            let originalKey = null;
            
            if (USERS[rawLogin]) {
                originalKey = rawLogin;
            } else if (USERS_LOWER[rawLogin.toLowerCase()]) {
                originalKey = USERS_LOWER[rawLogin.toLowerCase()];
            }

            if (originalKey && USERS[originalKey].password === password) {
                state.currentUser = originalKey;
                document.getElementById('login-error').style.display = 'none';
                localStorage.setItem('alpha_current_user', originalKey);
                console.log(`[LOGIN] ✅ ${originalKey}`);
                showPage('terminal-page');
            } else {
                console.log(`[LOGIN] ❌ Попытка: '${rawLogin}'`);
                const errorDiv = document.getElementById('login-error');
                errorDiv.textContent = '❌ Неверный логин или пароль';
                errorDiv.style.display = 'block';
            }
        });

        // ===== ВЫХОД =====
        function logout() {
            state.currentUser = null;
            localStorage.removeItem('alpha_current_user');
            showPage('login-page');
        }

        // ===== ТЕРМИНАЛ =====
        function renderTerminal() {
            const u = USERS[state.currentUser];
            const un = state.currentUser;
            const duty = un in state.activeShifts;
            const sd = state.activeShifts[un] || {};
            const sec = sd.elapsed_seconds || 0;
            const timer = formatTimer(sec);
            const now = new Date();

            const myReports = state.reports
                .filter(r => r.username === un)
                .sort((a, b) => b.id - a.id)
                .slice(0, 10);

            const html = `
                <div class="bar">
                    <div>
                        <span style="color:var(--ac);font-weight:bold;font-size:16px">${u.full_name}</span>
                        <span style="color:var(--mt);font-size:11px">(${state.currentUser})</span>
                        ${u.role === 'admin' ? '<span class="badge badge-adm">АДМИН</span>' : ''}
                    </div>
                    <div>
                        <button onclick="showPage('reports-page')" class="btn btn-sm btn-act">📋 ОТЧЁТЫ</button>
                        ${u.role === 'admin' ? '<button onclick="showPage(\'admin-page\')" class="btn btn-sm btn-act">📊 ПАНЕЛЬ</button>' : ''}
                        <button onclick="logout()" class="out">ВЫХОД</button>
                    </div>
                </div>
                <div class="card" style="text-align:center">
                    <img src="static/logo.png" class="logo-img" onerror="this.style.display='none'" alt="Логотип">
                    <div class="logo">ЧОО «АЛЬФА»</div>
                    <div class="sub">ТЕРМИНАЛ v5.1</div>
                </div>
                <div class="card" style="text-align:center">
                    <div class="info-t">СТАТУС СМЕНЫ</div>
                    <div style="font-size:38px;font-weight:bold;color:${duty ? '#2ECC71' : '#E63946'}">${duty ? 'НА СМЕНЕ' : 'ВНЕ СМЕНЫ'}</div>
                    <div style="font-size:22px;margin-top:8px">${timer}</div>
                </div>
                <button class="btn ${duty ? 'btn-end' : 'btn-start'}" onclick="toggleShift()">${duty ? '📤 СДАТЬ' : '🛡️ ЗАСТУПИТЬ'}</button>
                <button class="btn btn-alarm ${state.alarmActive ? 'active' : ''}" onclick="triggerAlarm()">${state.alarmActive ? '🔴 ТРЕВОГА АКТИВНА!' : '🚨 ТРЕВОГА'}</button>
                ${state.alarmActive ? '<button class="btn btn-end" onclick="resetAlarm()">🔇 СБРОСИТЬ</button>' : ''}
                <div class="card">
                    <div class="info-t">ИНФОРМАЦИЯ</div>
                    <p>ID: ${sd.shift_id || '--'} | Начало: ${formatDate(sd.start_time)} | Время: ${now.toLocaleTimeString('ru-RU')}</p>
                    <p>Охранник: ${u.full_name}</p>
                </div>
                <div class="card">
                    <div class="info-t">📝 МОИ ОТЧЁТЫ</div>
                    <div class="scroll">
                        <table>
                            <tr><th>ID</th><th>Тип</th><th>Описание</th><th>Время</th><th></th></tr>
                            ${myReports.map(r => `
                                <tr>
                                    <td><b>#${r.id}</b></td>
                                    <td style="color:${getReportColor(r.type)}">${r.type}</td>
                                    <td>${r.text.substring(0, 35)}${r.text.length > 35 ? '...' : ''}</td>
                                    <td style="font-size:11px">${r.time}</td>
                                    <td><button class="btn btn-xs btn-act" onclick="viewReport(${r.id})">👁️</button></td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>
                <button class="btn btn-act" style="text-align:center;font-size:16px;padding:14px" onclick="showPage('reports-page')">📋 НОВЫЙ ОТЧЁТ</button>
            `;

            document.getElementById('terminal-content').innerHTML = html;
            document.body.className = state.alarmActive ? 'alarm' : '';
        }

        // ===== ОТЧЁТЫ =====
        function renderReports() {
            const u = USERS[state.currentUser];
            const html = `
                <div class="bar">
                    <div><span style="color:var(--ac);font-weight:bold">${u.full_name}</span></div>
                    <div>
                        <button onclick="showPage('terminal-page')" class="btn btn-sm btn-act">🏠</button>
                        <button onclick="logout()" class="out">ВЫХОД</button>
                    </div>
                </div>
                <div class="card" style="text-align:center">
                    <img src="static/logo.png" class="logo-img" onerror="this.style.display='none'" alt="Логотип">
                    <div class="logo">ЧОО «АЛЬФА»</div>
                    <div class="sub">ШАБЛОНЫ ОТЧЁТОВ</div>
                </div>
                ${[
                    { type: 'Задержание', color: '#E74C3C', icon: '🚔' },
                    { type: 'Докладная', color: '#F39C12', icon: '📄' },
                    { type: 'Применение оружия', color: '#E67E22', icon: '🔫' },
                    { type: 'ГБР Выезд', color: '#3498DB', icon: '🚁' }
                ].map((t, i) => `
                    <div class="card" style="border-left:4px solid ${t.color};cursor:pointer">
                        <div onclick="toggleReportForm(${i})" style="font-size:20px;color:${t.color};font-weight:bold">
                            ${t.icon} ${t.type.toUpperCase()} <span style="float:right;font-size:14px" id="arrow${i}">▼</span>
                        </div>
                        <div id="form${i}" class="form-expand">
                            <div style="margin-top:15px">
                                <input type="text" id="name${i}" placeholder="Объект / имя">
                                <textarea id="text${i}" placeholder="Описание..."></textarea>
                                <button class="btn" style="background:${t.color};color:#fff;font-weight:bold" onclick="createReport('${t.type}', ${i})">📝 СОЗДАТЬ</button>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
            document.getElementById('reports-content').innerHTML = html;
        }

        function toggleReportForm(index) {
            const form = document.getElementById('form' + index);
            const arrow = document.getElementById('arrow' + index);
            if (form.classList.contains('open')) {
                form.style.maxHeight = '0';
                form.classList.remove('open');
                arrow.textContent = '▼';
            } else {
                form.style.maxHeight = form.scrollHeight + 'px';
                form.classList.add('open');
                arrow.textContent = '▲';
            }
        }

        function createReport(type, index) {
            const name = document.getElementById('name' + index).value.trim();
            const text = document.getElementById('text' + index).value.trim() || '(пусто)';
            const full = name ? `${name} — ${text}` : text;
            const now = new Date();
            const sid = state.activeShifts[state.currentUser]?.shift_id || 'N/A';
            const rid = state.reports.length + 1;

            state.reports.push({
                id: rid,
                type: type,
                text: full,
                time: formatDateTime(now),
                shift_id: sid,
                username: state.currentUser
            });
            saveData();
            showPage('reports-page');
        }

        // ===== ПРОСМОТР ОТЧЁТА =====
        function viewReport(rid) {
            const r = state.reports.find(r => r.id === rid);
            if (!r) return;
            const author = USERS[r.username]?.full_name || r.username;
            const modal = document.getElementById('report-modal');
            const content = document.getElementById('report-modal-content');

            content.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                    <div class="logo" style="font-size:20px">ОТЧЁТ #${r.id}</div>
                    <span onclick="closeModal()" style="color:var(--mt);font-size:20px;cursor:pointer">✕</span>
                </div>
                <div class="det-l">ТИП</div>
                <div class="det-v" style="color:${getReportColor(r.type)}">${r.type}</div>
                <div class="det-l">ID СМЕНЫ</div>
                <div class="det-v">${r.shift_id}</div>
                <div class="det-l">АВТОР</div>
                <div class="det-v">${author}</div>
                <div class="det-l">ВРЕМЯ</div>
                <div class="det-v">${r.time}</div>
                <div class="det-l">СОДЕРЖАНИЕ</div>
                <div class="det-t">${r.text}</div>
                <div style="margin-top:20px;text-align:center">
                    <button class="btn btn-act" style="display:inline-block" onclick="closeModal()">🔙 ЗАКРЫТЬ</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('report-modal').style.display = 'none';
        }

        document.getElementById('report-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ===== СМЕНА =====
        function toggleShift() {
            const un = state.currentUser;
            const now = new Date();
            
            if (!(un in state.activeShifts)) {
                state.shiftCounter++;
                const sid = `ALPHA-${now.toLocaleDateString('ru-RU').replace(/\./g, '-')}-${String(state.shiftCounter).padStart(3, '0')}`;
                state.activeShifts[un] = {
                    shift_id: sid,
                    start_time: now.toISOString(),
                    elapsed_seconds: 0
                };
                state.reports.push({
                    id: state.reports.length + 1,
                    type: 'О смене',
                    text: `Заступил: ${sid}`,
                    time: formatDateTime(now),
                    shift_id: sid,
                    username: un
                });
            } else {
                const sd = state.activeShifts[un];
                const totalSec = sd.elapsed_seconds;
                const hours = Math.floor(totalSec / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                
                state.reports.push({
                    id: state.reports.length + 1,
                    type: 'О смене',
                    text: `Сдал: ${hours}ч ${minutes}мин`,
                    time: formatDateTime(now),
                    shift_id: sd.shift_id,
                    username: un
                });
                state.shiftHistory.push({
                    shift_id: sd.shift_id,
                    username: un,
                    start: formatDateTime(sd.start_time),
                    end: formatDateTime(now),
                    hours: Math.round(totalSec / 3600 * 10) / 10
                });
                delete state.activeShifts[un];
            }
            saveData();
            renderTerminal();
        }

        // ===== ТРЕВОГА =====
        function triggerAlarm() {
            if (!state.alarmActive) {
                state.alarmActive = true;
                const now = new Date();
                const sid = state.activeShifts[state.currentUser]?.shift_id || null;
                const fullName = USERS[state.currentUser]?.full_name || 'Система';

                state.alarms.push({
                    time: formatDateTime(now),
                    active: true,
                    shift_id: sid,
                    username: state.currentUser,
                    full_name: fullName
                });
                state.reports.push({
                    id: state.reports.length + 1,
                    type: 'ТРЕВОГА',
                    text: `🚨 ТРЕВОГА! Активировал: ${fullName}`,
                    time: formatDateTime(now),
                    shift_id: sid,
                    username: state.currentUser
                });
                saveData();
            }
            renderTerminal();
        }

        function resetAlarm() {
            if (state.alarmActive) {
                state.alarmActive = false;
                if (state.alarms.length > 0) {
                    state.alarms[state.alarms.length - 1].active = false;
                }
                state.reports.push({
                    id: state.reports.length + 1,
                    type: 'ТРЕВОГА',
                    text: '🔇 Сброшена',
                    time: formatDateTime(new Date()),
                    shift_id: null,
                    username: 'system'
                });
                saveData();
            }
            renderTerminal();
        }

        // ===== АДМИН-ПАНЕЛЬ =====
        function renderAdmin() {
            const u = USERS[state.currentUser];
            if (!u || u.role !== 'admin') {
                showPage('terminal-page');
                return;
            }

            const usersList = Object.entries(USERS).map(([un, ud]) => {
                const on = un in state.activeShifts;
                const sec = state.activeShifts[un]?.elapsed_seconds || 0;
                return {
                    un,
                    fn: ud.full_name,
                    rl: ud.role || 'guard',
                    on,
                    tm: on ? formatTimer(sec) : null
                };
            });

            const shiftsList = Object.entries(state.activeShifts).map(([un, sd]) => {
                const sec = sd.elapsed_seconds || 0;
                return {
                    fn: USERS[un]?.full_name || un,
                    un,
                    id: sd.shift_id || '',
                    st: formatDate(sd.start_time),
                    tm: formatTimer(sec)
                };
            });

            const allReports = [...state.reports].sort((a, b) => b.id - a.id).slice(0, 50);

            const html = `
                <div class="bar">
                    <div>
                        <span style="color:var(--ac);font-weight:bold;font-size:18px">${u.full_name}</span>
                        <span class="badge badge-adm">АДМИН</span>
                    </div>
                    <div>
                        <button onclick="showPage('terminal-page')" class="btn btn-sm btn-act">🏠</button>
                        <button onclick="logout()" class="out">ВЫХОД</button>
                    </div>
                </div>
                <img src="static/logo.png" class="logo-img" style="width:100px;height:100px;display:block;margin:0 auto 15px" onerror="this.style.display='none'" alt="Логотип">
                <div class="logo" style="font-size:32px">ЧОО «АЛЬФА»</div>
                <div class="sub" style="margin-bottom:25px">АДМИН-ПАНЕЛЬ</div>
                
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px">
                    <div class="card" style="text-align:center;border-left:4px solid var(--gn)">
                        <div style="font-size:36px;color:var(--gn)">${shiftsList.length}</div>
                        <div style="color:var(--mt);font-size:12px">НА ПОСТУ</div>
                    </div>
                    <div class="card" style="text-align:center;border-left:4px solid var(--ac)">
                        <div style="font-size:36px;color:var(--ac)">${state.reports.length}</div>
                        <div style="color:var(--mt);font-size:12px">ОТЧЁТОВ</div>
                    </div>
                    <div class="card" style="text-align:center;border-left:4px solid var(--or)">
                        <div style="font-size:36px;color:var(--or)">${state.alarms.length}</div>
                        <div style="color:var(--mt);font-size:12px">ТРЕВОГ</div>
                    </div>
                    <div class="card" style="text-align:center;border-left:4px solid var(--rd)">
                        <div style="font-size:36px;color:var(--rd)">${state.alarmActive ? '🔴' : '🟢'}</div>
                        <div style="color:var(--mt);font-size:12px">ТРЕВОГА</div>
                    </div>
                </div>
                
                <div class="flex">
                    <div class="flex-c">
                        <div class="card">
                            <div class="info-t">👥 СОТРУДНИКИ</div>
                            <div class="scroll" style="max-height:350px">
                                <table>
                                    <tr><th>Логин</th><th>ФИО</th><th>Роль</th><th>Статус</th><th>На смене</th></tr>
                                    ${usersList.map(user => `
                                        <tr>
                                            <td><b>${user.un}</b></td>
                                            <td>${user.fn}</td>
                                            <td>${user.rl === 'admin' ? '<span class="badge badge-adm">АДМИН</span>' : 'Охранник'}</td>
                                            <td>${user.on ? '<span class="badge badge-on">● НА ПОСТУ</span>' : '<span class="badge badge-off">○ НЕТ</span>'}</td>
                                            <td>${user.tm || '--'}</td>
                                        </tr>
                                    `).join('')}
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="flex-c">
                        <div class="card">
                            <div class="info-t">🟢 АКТИВНЫЕ СМЕНЫ</div>
                            <div class="scroll" style="max-height:350px">
                                ${shiftsList.length > 0 ? `
                                    <table>
                                        <tr><th>Охранник</th><th>ID</th><th>Начало</th><th>Прошло</th><th></th></tr>
                                        ${shiftsList.map(s => `
                                            <tr>
                                                <td><b>${s.fn}</b></td>
                                                <td style="font-size:11px">${s.id}</td>
                                                <td>${s.st}</td>
                                                <td style="color:var(--gn);font-weight:bold">${s.tm}</td>
                                                <td><button class="btn btn-xs btn-end" style="padding:4px 8px;font-size:10px" onclick="forceEnd('${s.un}')">⛔</button></td>
                                            </tr>
                                        `).join('')}
                                    </table>
                                ` : '<p style="color:var(--mt);text-align:center;padding:30px">Никого на посту</p>'}
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="info-t">📝 ВСЕ ОТЧЁТЫ</div>
                    <div class="scroll" style="max-height:300px">
                        <table>
                            <tr><th>ID</th><th>Автор</th><th>Тип</th><th>Описание</th><th>Время</th></tr>
                            ${allReports.map(r => `
                                <tr>
                                    <td><b>#${r.id}</b></td>
                                    <td>${r.username}</td>
                                    <td>${r.type}</td>
                                    <td>${r.text.substring(0, 45)}</td>
                                    <td style="font-size:11px">${r.time}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>
            `;
            document.getElementById('admin-content').innerHTML = html;
        }

        function forceEnd(username) {
            const u = USERS[state.currentUser];
            if (!u || u.role !== 'admin') return;

            if (username in state.activeShifts) {
                const sd = state.activeShifts[username];
                const totalSec = sd.elapsed_seconds;
                const hours = Math.floor(totalSec / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const now = new Date();

                state.reports.push({
                    id: state.reports.length + 1,
                    type: 'О смене',
                    text: `⛔ Админ закрыл смену: ${hours}ч ${minutes}мин`,
                    time: formatDateTime(now),
                    shift_id: sd.shift_id,
                    username: username
                });
                state.shiftHistory.push({
                    shift_id: sd.shift_id,
                    username: username,
                    start: formatDateTime(sd.start_time),
                    end: formatDateTime(now),
                    hours: Math.round(totalSec / 3600 * 10) / 10
                });
                delete state.activeShifts[username];
                saveData();
                renderAdmin();
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        async function init() {
            console.log('🛡️  ЧОО АЛЬФА v5.1 — ЗАГРУЗКА');
            
            // Загружаем пользователей из файла
            await loadUsers();
            
            // Загружаем данные из файла (если есть)
            await loadData();
            
            // Если нет файла данных, пробуем загрузить из localStorage
            if (state.reports.length === 0) {
                const savedData = localStorage.getItem('alpha_data');
                if (savedData) {
                    try {
                        const data = JSON.parse(savedData);
                        state.shiftCounter = data.shift_counter || 100;
                        state.reports = data.reports || [];
                        state.alarms = data.alarms || [];
                        state.shiftHistory = data.shift_history || [];
                        
                        if (data.active_shifts) {
                            for (let username in data.active_shifts) {
                                const s = data.active_shifts[username];
                                state.activeShifts[username] = {
                                    shift_id: s.shift_id,
                                    start_time: s.start_time ? new Date(s.start_time) : new Date(),
                                    elapsed_seconds: s.elapsed_seconds || 0
                                };
                            }
                        }
                        console.log('📂 Данные загружены из localStorage');
                    } catch (e) {
                        console.error('Ошибка загрузки из localStorage:', e);
                    }
                }
            }
            
            // Скрываем загрузку
            document.getElementById('loading-overlay').style.display = 'none';
            
            // Проверяем, был ли предыдущий вход
            const savedUser = localStorage.getItem('alpha_current_user');
            if (savedUser && USERS[savedUser]) {
                state.currentUser = savedUser;
                showPage('terminal-page');
            } else {
                showPage('login-page');
            }
            
            console.log('✅ Терминал готов');
            console.log(`👤 Пользователей: ${Object.keys(USERS).length}`);
            console.log('='.repeat(60));
        }

        // Запускаем при загрузке страницы
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
